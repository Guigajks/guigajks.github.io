summary:
  en: Frontend Engineer with 8+ years of experience building scalable web applications using Vue.js, TypeScript and modern frontend architectures. Currently developing enterprise solutions for EnBW through Nearshore Portugal, creating reusable Vue 3 components integrated with Contentful CMS. Throughout my career, I have worked on international projects across the energy, telecommunications, recruitment and fintech sectors, delivering maintainable and high-performance frontend solutions. My experience includes Vue.js, Nuxt, TypeScript, SCSS, AngularJS, automated testing and component-driven development. I enjoy solving complex frontend challenges, improving application architecture and creating reusable, accessible and high-quality user interfaces. I am particularly interested in modern frontend engineering, performance optimization and scalable software design.
  pt: Engenheiro frontend com mais de 8 anos de experiência no desenvolvimento de aplicações web escaláveis com Vue.js, TypeScript e arquiteturas modernas de frontend. Atualmente desenvolve soluções enterprise para a EnBW através da Nearshore Portugal, criando componentes reutilizáveis em Vue 3 integrados ao Contentful CMS. Ao longo da carreira, atuou em projetos internacionais nos setores de energia, telecomunicações, recrutamento e fintech, entregando soluções frontend manuteníveis e de alto desempenho. A experiência inclui Vue.js, Nuxt, TypeScript, SCSS, AngularJS, testes automatizados e desenvolvimento orientado a componentes. Gosta de resolver desafios complexos de frontend, evoluir a arquitetura das aplicações e criar interfaces reutilizáveis, acessíveis e de alta qualidade. Tem especial interesse em engenharia frontend moderna, otimização de performance e design de software escalável.
